name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: /home/ubuntu/apps/kurir-toko-api
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_DIR=$(printf '%q' \"$VPS_APP_DIR\") bash -s" << 'REMOTE'
            set -e

            cd "$DEPLOY_DIR"
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans
            docker image prune -f
          REMOTE
